<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dijkstra - Matriz de Comparación de Nodos</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: #111827;
            --border-color: #1f2937;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #38bdf8;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #fb923c;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background:
                radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.12), transparent 28%),
                linear-gradient(rgba(56, 189, 248, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16, 185, 129, 0.035) 1px, transparent 1px),
                var(--bg-color);
            background-size: auto, 34px 34px, 34px 34px, auto;
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 { margin: 0; font-size: 26px; color: var(--primary); }
        .instructions { font-size: 14px; color: var(--text-muted); margin: 5px 0; }

        .layout {
            display: grid;
            grid-template-columns: 320px 1fr 540px;
            gap: 20px;
            margin-top: 15px;
        }

        @media (max-width: 1200px) {
            .layout { grid-template-columns: 1fr; }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.04), 0 18px 35px rgba(0, 0, 0, 0.26);
        }

        .card h3 { margin-top: 0; margin-bottom: 12px; font-size: 14px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; color: var(--primary); text-transform: uppercase; letter-spacing: 0.5px;}

        .btn {
            width: 100%;
            padding: 11px;
            margin-bottom: 10px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            color: #0f172a;
            transition: background 0.2s;
        }
        .btn-primary { background-color: var(--primary); }

        .traffic-input-group {
            background: #0b0f19;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 10px;
        }

        .traffic-input-group label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .traffic-input-group input {
            width: 100%;
            padding: 6px;
            background: #111827;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: monospace;
            font-size: 13px;
        }

        .canvas-area {
            background-color: #05070f;
            border: 2px dashed #334155;
            border-radius: 12px;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 30px rgba(16, 185, 129, 0.08), 0 0 28px rgba(56, 189, 248, 0.08);
        }

        canvas {
            display: block;
            background-color: #05070f;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🚦 Comparador de Nodos Dijkstra en Tiempo Real</h1>
            <p class="instructions">Evaluación paralela de la red: El nodo con menor peso (Camino Mínimo) toma el control del cruce central.</p>
        </header>

        <div class="layout">
            
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div class="card">
                    <h3>🚗 Carga de Nodos Origen</h3>
                    
                    <div class="traffic-input-group" style="border-left: 4px solid #ff5757;">
                        <label>🔴 Semáforo 1 (Norte)</label>
                        <input type="number" id="cars-s1" value="24" min="1" oninput="actualizarYReiniciarCiclo()">
                    </div>

                    <div class="traffic-input-group" style="border-left: 4px solid #38bdf8;">
                        <label>🔵 Semáforo 2 (Sur)</label>
                        <input type="number" id="cars-s2" value="12" min="1" oninput="actualizarYReiniciarCiclo()">
                    </div>

                    <div class="traffic-input-group" style="border-left: 4px solid #fb923c;">
                        <label>🟠 Semáforo 3 (Oeste)</label>
                        <input type="number" id="cars-s3" value="40" min="1" oninput="actualizarYReiniciarCiclo()">
                    </div>

                    <div class="traffic-input-group" style="border-left: 4px solid #c084fc;">
                        <label>🟣 Semáforo 4 (Este)</label>
                        <input type="number" id="cars-s4" value="18" min="1" oninput="actualizarYReiniciarCiclo()">
                    </div>

                    <button class="btn btn-primary" onclick="inyectarTraficoAleatorio()">🎲 Recalcular e Iniciar Secuencia</button>
                </div>

                <div class="card">
                    <h3>👁️ Consola Analítica</h3>
                    <div id="logs-dijkstra" style="font-size: 11.5px; font-family: monospace; text-align: left; padding: 12px; background: #0b0f19; border-radius: 6px; line-height: 1.4; color: #16e1d0; height: 160px; overflow-y: auto;">
                        Esperando datos...
                    </div>
                </div>
            </div>

            <div class="canvas-area">
                <canvas id="canvasCruce" width="520" height="480"></canvas>
            </div>

            <div class="card" style="display: flex; flex-direction: column;">
                <h3>📊 Topología de Red y Cola de Prioridad</h3>
                <canvas id="canvasGrafoDijkstra" width="520" height="450" style="background: #0b0f19; border-radius: 8px;"></canvas>
            </div>

        </div>
    </div>

    <script>
        const canvasCruce = document.getElementById('canvasCruce');
        const ctxCruce = canvasCruce.getContext('2d');
        const canvasGrafo = document.getElementById('canvasGrafoDijkstra');
        const ctxGrafo = canvasGrafo.getContext('2d');

        // Mapeo espacial de posiciones
        // Mapeo espacial de posiciones corregido y centrado en los carriles
const posicionesSemaforos = {
    "s1": { x: 210, y: 140, label: "Semáforo 1", short: "1" }, // Centrado en el carril de bajada Norte
    "s2": { x: 310, y: 320, label: "Semáforo 2", short: "2" }, // Centrado en el carril de subida Sur
    "s3": { x: 170, y: 280, label: "Semáforo 3", short: "3" }, // Centrado en el carril de entrada Oeste
    "s4": { x: 350, y: 180, label: "Semáforo 4", short: "4" }  // Centrado en el carril de entrada Este
};

        // Estado interno de la computación
        let nodoGanadorDijkstra = "";
        let secuenciaNodosOrdenada = [];
        let indiceSecuenciaActual = 0;
        let temporizadorSecuencia = null;
        let listaComparacionDijkstra = [];
        let costosBaseNodos = {};
        let totalVehiculos = 0;
        let pulsoNeon = 1;
        let pulsoAscendente = false;

        function nombreSemaforo(id) {
            return posicionesSemaforos[id]?.label || id.toUpperCase();
        }

        function numeroSemaforo(id) {
            return posicionesSemaforos[id]?.short || id.replace("s", "");
        }

        function textoCanvas(ctx, texto, x, y, opciones = {}) {
            const {
                color = "#f8fafc",
                font = "bold 10px monospace",
                align = "center",
                baseline = "middle",
                shadow = true
            } = opciones;

            ctx.save();
            ctx.font = font;
            ctx.textAlign = align;
            ctx.textBaseline = baseline;
            if (shadow) {
                ctx.lineWidth = 4;
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.strokeText(texto, x, y);
            }
            ctx.fillStyle = color;
            ctx.fillText(texto, x, y);
            ctx.restore();
        }

        function etiquetaCanvas(ctx, texto, x, y, opciones = {}) {
            const {
                font = "bold 10px sans-serif",
                padX = 6,
                padY = 4,
                bg = "rgba(2, 6, 23, 0.82)",
                border = "rgba(56, 189, 248, 0.45)",
                color = "#f8fafc"
            } = opciones;

            ctx.save();
            ctx.font = font;
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            const metrics = ctx.measureText(texto);
            const width = metrics.width + padX * 2;
            const height = parseInt(font, 10) + padY * 2;
            ctx.fillStyle = bg;
            ctx.strokeStyle = border;
            ctx.lineWidth = 1;
            ctx.fillRect(x - width / 2, y - height / 2, width, height);
            ctx.strokeRect(x - width / 2, y - height / 2, width, height);
            ctx.fillStyle = color;
            ctx.fillText(texto, x, y + 0.5);
            ctx.restore();
        }

        function redibujarTodo() {
            ctxCruce.clearRect(0, 0, canvasCruce.width, canvasCruce.height);

            // 1. Dibujar Calles
            ctxCruce.fillStyle = "#1e293b";
            ctxCruce.fillRect(190, 0, 140, canvasCruce.height); 
            ctxCruce.fillRect(0, 160, canvasCruce.width, 140);  
            ctxCruce.fillRect(190, 160, 140, 140);             

            // Líneas divisorias discontinuas amarillas
            ctxCruce.strokeStyle = "#eab308";
            ctxCruce.lineWidth = 2;
            ctxCruce.setLineDash([8, 8]);
            ctxCruce.beginPath();
            ctxCruce.moveTo(260, 0); ctxCruce.lineTo(260, 160);
            ctxCruce.moveTo(260, 300); ctxCruce.lineTo(260, canvasCruce.height);
            ctxCruce.moveTo(0, 230); ctxCruce.lineTo(190, 230);
            ctxCruce.moveTo(330, 230); ctxCruce.lineTo(canvasCruce.width, 230);
            ctxCruce.stroke();
            ctxCruce.setLineDash([]); 

            // Líneas de Parada Blancas
            ctxCruce.strokeStyle = "#ffffff";
            ctxCruce.lineWidth = 4;
            ctxCruce.beginPath();
            ctxCruce.moveTo(190, 160); ctxCruce.lineTo(260, 160); // s1
            ctxCruce.moveTo(260, 300); ctxCruce.lineTo(330, 300); // s2
            ctxCruce.moveTo(190, 230); ctxCruce.lineTo(190, 300); // s3
            ctxCruce.moveTo(330, 160); ctxCruce.lineTo(330, 230); // s4
            ctxCruce.stroke();

            // Modulación del efecto de brillo
            if (pulsoAscendente) {
                pulsoNeon += 0.02; if (pulsoNeon >= 1) pulsoAscendente = false;
            } else {
                pulsoNeon -= 0.02; if (pulsoNeon <= 0.4) pulsoAscendente = true;
            }

            // 2. Dibujar flujos direccionales basados estrictamente en el Ganador de Dijkstra
            trazarRutaRecta(225, 130, 225, 340, Math.PI/2, (nodoGanadorDijkstra === "s1"));
            trazarRutaCurva(225, 130, 225, 180, 150, 180, Math.PI, (nodoGanadorDijkstra === "s1"));
            trazarRutaCurva(225, 130, 225, 250, 360, 250, 0, (nodoGanadorDijkstra === "s1"));

            trazarRutaRecta(295, 340, 295, 130, -Math.PI/2, (nodoGanadorDijkstra === "s2"));
            trazarRutaCurva(295, 340, 295, 280, 360, 280, 0, (nodoGanadorDijkstra === "s2"));
            trazarRutaCurva(295, 340, 295, 200, 150, 200, Math.PI, (nodoGanadorDijkstra === "s2"));

            trazarRutaRecta(150, 265, 360, 265, 0, (nodoGanadorDijkstra === "s3"));
            trazarRutaCurva(150, 265, 220, 265, 220, 340, Math.PI/2, (nodoGanadorDijkstra === "s3"));
            trazarRutaCurva(150, 265, 280, 265, 280, 130, -Math.PI/2, (nodoGanadorDijkstra === "s3"));

            trazarRutaRecta(360, 195, 150, 195, Math.PI, (nodoGanadorDijkstra === "s4"));
            trazarRutaCurva(360, 195, 305, 195, 305, 130, -Math.PI/2, (nodoGanadorDijkstra === "s4"));
            trazarRutaCurva(360, 195, 220, 195, 220, 340, Math.PI/2, (nodoGanadorDijkstra === "s4"));

            // 3. Renderizar Balizas de Semáforos Centrales (Solo uno Verde, resto Rojos)
            for (let id in posicionesSemaforos) {
                let p = posicionesSemaforos[id];
                let autos = document.getElementById(`cars-${id}`).value;
                let esVerde = (id === nodoGanadorDijkstra);

                ctxCruce.save();
                if (esVerde) {
                    const halo = 18 + pulsoNeon * 10;
                    const grad = ctxCruce.createRadialGradient(p.x, p.y, 6, p.x, p.y, halo);
                    grad.addColorStop(0, "rgba(16, 185, 129, 0.55)");
                    grad.addColorStop(1, "rgba(16, 185, 129, 0)");
                    ctxCruce.fillStyle = grad;
                    ctxCruce.beginPath();
                    ctxCruce.arc(p.x, p.y, halo, 0, 2 * Math.PI);
                    ctxCruce.fill();
                }

                ctxCruce.beginPath();
                ctxCruce.arc(p.x, p.y, 16, 0, 2 * Math.PI);
                ctxCruce.fillStyle = esVerde ? "var(--success)" : "var(--danger)";
                ctxCruce.fill();

                ctxCruce.strokeStyle = esVerde ? `rgba(16, 185, 129, ${pulsoNeon})` : "transparent";
                ctxCruce.lineWidth = 4;
                ctxCruce.stroke();

                etiquetaCanvas(ctxCruce, p.label, p.x, p.y - 29, {
                    font: "bold 10px sans-serif",
                    bg: "rgba(2, 6, 23, 0.9)",
                    border: esVerde ? "rgba(16, 185, 129, 0.75)" : "rgba(148, 163, 184, 0.45)"
                });
                textoCanvas(ctxCruce, `${p.short}:${autos}`, p.x, p.y, {
                    font: "bold 10px monospace",
                    color: "#ffffff"
                });
                ctxCruce.restore();
            }

            // 4. PANEL DERECHO: INTERFAZ TOPOLÓGICA DEL GRAFO Y LOGS MATRICIALES
            ctxGrafo.clearRect(0, 0, canvasGrafo.width, canvasGrafo.height);
            
            ctxGrafo.font = "bold 13px monospace";
            ctxGrafo.fillStyle = "var(--primary)";
            ctxGrafo.fillText("⚡ ÁRBOL TOPOLÓGICO Y COMPARACIÓN EN TIEMPO REAL", 15, 25);

            ctxGrafo.font = "11px monospace";
            ctxGrafo.fillStyle = "var(--text-muted)";
            ctxGrafo.fillText(`Carga Neta del Sistema (Σ): ${totalVehiculos} vehículos`, 15, 45);

            // --- DIBUJAR ESTRUCTURA DE GRAFO (Semáforos 1-4 en círculo) ---
            const nodosVisuales = {
                "s1": { x: 95, y: 110, label: "Semáforo 1", short: "1" },
                "s4": { x: 160, y: 170, label: "Semáforo 4", short: "4" },
                "s2": { x: 95, y: 230, label: "Semáforo 2", short: "2" },
                "s3": { x: 30, y: 170, label: "Semáforo 3", short: "3" }
            };

            // Dibujar enlaces/aristas del grafo
            ctxGrafo.strokeStyle = "#1e293b";
            ctxGrafo.lineWidth = 2;
            ctxGrafo.beginPath();
            ctxGrafo.moveTo(nodosVisuales.s1.x, nodosVisuales.s1.y); ctxGrafo.lineTo(nodosVisuales.s4.x, nodosVisuales.s4.y);
            ctxGrafo.lineTo(nodosVisuales.s2.x, nodosVisuales.s2.y); ctxGrafo.lineTo(nodosVisuales.s3.x, nodosVisuales.s3.y);
            ctxGrafo.lineTo(nodosVisuales.s1.x, nodosVisuales.s1.y);
            ctxGrafo.stroke();

            // Renderizar círculos de nodos en la topología derecha
            for (let id in nodosVisuales) {
                let nv = nodosVisuales[id];
                let esGanador = (id === nodoGanadorDijkstra);

                if (esGanador) {
                    const halo = 20 + pulsoNeon * 8;
                    const grad = ctxGrafo.createRadialGradient(nv.x, nv.y, 6, nv.x, nv.y, halo);
                    grad.addColorStop(0, "rgba(16, 185, 129, 0.5)");
                    grad.addColorStop(1, "rgba(16, 185, 129, 0)");
                    ctxGrafo.fillStyle = grad;
                    ctxGrafo.beginPath();
                    ctxGrafo.arc(nv.x, nv.y, halo, 0, 2 * Math.PI);
                    ctxGrafo.fill();
                }

                ctxGrafo.beginPath();
                ctxGrafo.arc(nv.x, nv.y, 16, 0, 2 * Math.PI);
                ctxGrafo.fillStyle = esGanador ? "var(--success)" : "var(--danger)";
                ctxGrafo.fill();
                ctxGrafo.strokeStyle = "#475569";
                ctxGrafo.stroke();

                textoCanvas(ctxGrafo, nv.short, nv.x, nv.y, {
                    font: "bold 10px monospace",
                    color: "#ffffff"
                });

                // Texto flotante de costo base del nodo
                etiquetaCanvas(ctxGrafo, nv.label, nv.x, nv.y + 28, {
                    font: "bold 8.5px monospace",
                    bg: "rgba(2, 6, 23, 0.86)",
                    border: "rgba(148, 163, 184, 0.35)"
                });
                textoCanvas(ctxGrafo, `W:${costosBaseNodos[id]?.toFixed(1)}`, nv.x, nv.y - 22, {
                    font: "bold 9px monospace",
                    color: "#f8fafc"
                });
            }

            // --- TABLA HASH DE COMPARACIÓN DE COSTOS (DIJKSTRA) ---
            let lineaY = 75;
            ctxGrafo.strokeStyle = "#334155";
            ctxGrafo.fillStyle = "#dbeafe";
            ctxGrafo.font = "bold 10px monospace";
            ctxGrafo.textAlign = "left";
            
            ctxGrafo.strokeRect(210, lineaY, 100, 22); ctxGrafo.fillText(" Nodo V", 214, lineaY + 15);
            ctxGrafo.strokeRect(310, lineaY, 85, 22); ctxGrafo.fillText(" Arista", 314, lineaY + 15);
            ctxGrafo.strokeRect(395, lineaY, 110, 22); ctxGrafo.fillText(" Costo", 399, lineaY + 15);
            lineaY += 22;

            listaComparacionDijkstra.forEach((arista, index) => {
                ctxGrafo.strokeStyle = "#1f2937";
                ctxGrafo.strokeRect(210, lineaY, 100, 22);
                ctxGrafo.strokeRect(310, lineaY, 85, 22);
                ctxGrafo.strokeRect(395, lineaY, 110, 22);

                let esMapeadoVerde = (arista.id === nodoGanadorDijkstra);
                ctxGrafo.fillStyle = esMapeadoVerde ? "#34d399" : "#fca5a5";

                ctxGrafo.fillText(`  Semaforo ${numeroSemaforo(arista.id)}`, 212, lineaY + 15);
                ctxGrafo.fillText(`  ${arista.giro.toUpperCase()}`, 312, lineaY + 15);
                
                let desglose = arista.giro === "derecha" ? `${arista.costo.toFixed(1)}` : `  ${arista.costo.toFixed(1)}`;
                ctxGrafo.fillText(desglose, 397, lineaY + 15);
                
                lineaY += 22;
            });

            // Recuadro explicativo matemático inferior
            ctxGrafo.fillStyle = "#090d16";
            ctxGrafo.fillRect(15, 325, 490, 100);
            ctxGrafo.strokeRect(15, 325, 490, 100);

            ctxGrafo.fillStyle = "var(--primary)";
            ctxGrafo.font = "bold 11px monospace";
            ctxGrafo.fillText("⚙️ ANÁLISIS DE RESISTENCIA MUTUA DIJKSTRA:", 25, 345);
            ctxGrafo.fillStyle = "#e5e7eb";
            ctxGrafo.fillText("• Cada nodo despacha segun la prioridad calculada por Dijkstra.", 25, 365);
            ctxGrafo.fillText("• Temporizador activo: cambio automatico cada 3 segundos.", 25, 385);

            ctxGrafo.fillStyle = nodoGanadorDijkstra ? "#34d399" : "#fdba74";
            ctxGrafo.fillText(nodoGanadorDijkstra ? `• TURNO ACTUAL: ${nombreSemaforo(nodoGanadorDijkstra)}` : "• Calculando turno...", 25, 405);

            ctxGrafo.fillStyle = "rgba(2, 6, 23, 0.96)";
            ctxGrafo.fillRect(205, 36, 300, 32);
            ctxGrafo.strokeStyle = `rgba(16, 185, 129, ${0.45 + pulsoNeon * 0.35})`;
            ctxGrafo.strokeRect(205, 36, 300, 32);
            ctxGrafo.fillStyle = "#bbf7d0";
            ctxGrafo.font = "bold 10px monospace";
            ctxGrafo.fillText(`HUD DIGITAL: ${nombreSemaforo(nodoGanadorDijkstra).toUpperCase()} EN VERDE`, 215, 57);
        }

        function trazarRutaRecta(x1, y1, x2, y2, angulo, activo) {
            ctxCruce.lineWidth = activo ? 4.5 : 0.8;
            ctxCruce.strokeStyle = activo ? `rgba(16, 185, 129, ${pulsoNeon})` : "rgba(239, 68, 68, 0.03)";
            ctxCruce.beginPath(); ctxCruce.moveTo(x1, y1); ctxCruce.lineTo(x2, y2); ctxCruce.stroke();
            dibujarFlecha(x2 - Math.cos(angulo)*8, y2 - Math.sin(angulo)*8, angulo, activo);
        }

        function trazarRutaCurva(x1, y1, cpX, cpY, x2, y2, angulo, activo) {
            ctxCruce.lineWidth = activo ? 4.5 : 0.8;
            ctxCruce.strokeStyle = activo ? `rgba(16, 185, 129, ${pulsoNeon})` : "rgba(239, 68, 68, 0.03)";
            ctxCruce.beginPath(); ctxCruce.moveTo(x1, y1); ctxCruce.quadraticCurveTo(cpX, cpY, x2, y2); ctxCruce.stroke();
            dibujarFlecha(x2, y2, angulo, activo);
        }

        function dibujarFlecha(x, y, angulo, activo) {
            ctxCruce.save(); ctxCruce.translate(x, y); ctxCruce.rotate(angulo);
            ctxCruce.fillStyle = activo ? "var(--success)" : "rgba(239, 68, 68, 0.08)";
            ctxCruce.beginPath(); ctxCruce.moveTo(0, 0); ctxCruce.lineTo(-7, -3); ctxCruce.lineTo(-7, 3); ctxCruce.fill();
            ctxCruce.restore();
        }

        // ======================================================================
        // NÚCLEO MATEMÁTICO: DIJKSTRA COMPLETO CON COMPARACIÓN DE ARISTAS
        // ======================================================================
        function calcularDijkstraEstricto() {
            const v1 = Math.max(1, parseInt(document.getElementById('cars-s1').value) || 0);
            const v2 = Math.max(1, parseInt(document.getElementById('cars-s2').value) || 0);
            const v3 = Math.max(1, parseInt(document.getElementById('cars-s3').value) || 0);
            const v4 = Math.max(1, parseInt(document.getElementById('cars-s4').value) || 0);

            totalVehiculos = v1 + v2 + v3 + v4;

            costosBaseNodos = {
                "s1": totalVehiculos / v1,
                "s2": totalVehiculos / v2,
                "s3": totalVehiculos / v3,
                "s4": totalVehiculos / v4
            };

            // Crear Cola de Prioridad del Grafo
            let colaPrioridad = [];
            Object.keys(costosBaseNodos).forEach(id => {
                let cBase = costosBaseNodos[id];
                colaPrioridad.push({ id: id, giro: "recto", costo: cBase });
                colaPrioridad.push({ id: id, giro: "derecha", costo: cBase  }); // Penalización de +2 a la derecha
            });

            // Dijkstra ordena las aristas para encontrar el camino de menor costo de la red
            colaPrioridad.sort((a, b) => a.costo - b.costo);

            // Guardamos las primeras 10 aristas ordenadas para alimentar la tabla dinámica del canvas derecho
            listaComparacionDijkstra = colaPrioridad.slice(0, 10);

            secuenciaNodosOrdenada = Object.keys(costosBaseNodos)
                .map(id => ({ id: id, costo: costosBaseNodos[id] }))
                .sort((a, b) => a.costo - b.costo)
                .map(nodo => nodo.id);

            if (!nodoGanadorDijkstra || !secuenciaNodosOrdenada.includes(nodoGanadorDijkstra)) {
                nodoGanadorDijkstra = secuenciaNodosOrdenada[0];
            }

            imprimirLogsConsola();
        }

        function iniciarOrquestadorTiempo() {
            if (temporizadorSecuencia) clearInterval(temporizadorSecuencia);

            indiceSecuenciaActual = 0;
            ejecutarPasoFase();

            temporizadorSecuencia = setInterval(() => {
                indiceSecuenciaActual++;
                if (indiceSecuenciaActual >= secuenciaNodosOrdenada.length) {
                    indiceSecuenciaActual = 0;
                }
                ejecutarPasoFase();
            }, 3000);
        }

        function ejecutarPasoFase() {
            if (!secuenciaNodosOrdenada.length) return;
            nodoGanadorDijkstra = secuenciaNodosOrdenada[indiceSecuenciaActual];
            imprimirLogsConsola();
        }

        function imprimirLogsConsola() {
            let logTexto = `[DIJKSTRA EVALUANDO PESOS DE NODOS]\n\n`;

            let listaOrdenada = Object.keys(costosBaseNodos)
                .map(id => ({ id: id, costo: costosBaseNodos[id] }))
                .sort((a, b) => a.costo - b.costo);

            listaOrdenada.forEach((nodo, i) => {
                logTexto += `${i+1}. ${nombreSemaforo(nodo.id)}: W = ${nodo.costo.toFixed(1)}\n`;
            });

            let secuenciaRuta = listaOrdenada.map(nodo => nombreSemaforo(nodo.id)).join(' ➔ ');

            logTexto += `\n>> SECUENCIA OPTIMA DE FLUJO:\n   ${secuenciaRuta}\n`;
            logTexto += `\n>> TURNO ACTUAL: ${nombreSemaforo(nodoGanadorDijkstra)} en VERDE.`;
            logTexto += `\n>> Los nodos restantes se mantienen en ROJO.`;
            logTexto += `\n>> Siguiente cambio automatico en: 3 segundos...`;

            document.getElementById('logs-dijkstra').innerText = logTexto;
        }

        function actualizarYReiniciarCiclo() {
            calcularDijkstraEstricto();
            iniciarOrquestadorTiempo();
        }

        function inyectarTraficoAleatorio() {
            document.getElementById('cars-s1').value = Math.floor(Math.random() * 40) + 5;
            document.getElementById('cars-s2').value = Math.floor(Math.random() * 40) + 5;
            document.getElementById('cars-s3').value = Math.floor(Math.random() * 40) + 5;
            document.getElementById('cars-s4').value = Math.floor(Math.random() * 40) + 5;
            
            actualizarYReiniciarCiclo();
        }

        function loopAnimacion() {
            redibujarTodo();
            requestAnimationFrame(loopAnimacion);
        }

        // Ejecución inicial con ciclo automático de semáforos
        calcularDijkstraEstricto();
        iniciarOrquestadorTiempo();
        loopAnimacion();
    </script>
</body>
