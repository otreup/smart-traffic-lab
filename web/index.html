<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Traffic Lab</title>
    <link rel="stylesheet" href="/static/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>Smart Traffic Lab</h1>
        <p>ESP32-CAM, YOLO y simulacion SUMO para semaforos inteligentes</p>
      </div>
      <div class="actions">
        <button id="webcamBtn" type="button">Webcam</button>
        <button id="esp32Btn" type="button">ESP32</button>
        <button id="autoBtn" type="button">Auto</button>
        <button id="refreshBtn" type="button">Actualizar</button>
        <button id="toggleSimBtn" type="button">Pausar simulacion</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel camera-panel">
        <div class="panel-head">
          <h2>Camara ESP32-CAM</h2>
          <span id="cameraStatus" class="status">Esperando</span>
        </div>
        <div class="camera-tabs">
          <button id="apiViewBtn" class="tab-button active" type="button">API</button>
          <button id="directViewBtn" class="tab-button" type="button">ESP32</button>
          <a id="openCameraLink" class="camera-link" href="http://192.168.1.44" target="_blank" rel="noreferrer">Abrir camara</a>
        </div>
        <img id="snapshot" class="camera-view active" alt="Camara procesada por API" />
        <iframe id="directCamera" class="camera-view" title="ESP32-CAM directa" src="http://192.168.1.44"></iframe>
        <div class="metrics">
          <div><strong id="detCount">0</strong><span>detecciones</span></div>
          <div><strong id="modelName">-</strong><span>modelo</span></div>
          <div><strong id="networkState">-</strong><span>SUMO</span></div>
        </div>
      </section>

      <section class="panel map-panel">
        <div class="panel-head">
          <h2>Carretera SUMO</h2>
          <span id="mapStatus" class="status">Cargando</span>
        </div>
        <canvas id="networkCanvas" width="1100" height="700"></canvas>
      </section>

      <section class="panel detections-panel">
        <div class="panel-head">
          <h2>Detecciones</h2>
          <span id="lastUpdate" class="status">Sin datos</span>
        </div>
        <div id="detectionsList" class="list"></div>
      </section>

      <section class="panel flow-panel">
        <div class="panel-head">
          <h2>Arbol funcional</h2>
        </div>
        <div class="flow-grid">
          <div>Camara</div>
          <div>YOLO</div>
          <div>Conteo</div>
          <div>Decision</div>
          <div>Semaforo</div>
          <div>SUMO</div>
        </div>
      </section>
    </main>

    <script src="/static/assets/app.js"></script>
  </body>
</html>
